<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5fafc"><title>Road to Sub 40</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><style>
:root{--ink:#17324a;--muted:#678095;--green:#16b878;--blue:#397bb8;--line:#d6e3eb;--bg:#eef5f8}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f9fcfd,#eaf3f7 58%,#f8fbfd)}button,input,textarea,select{font:inherit}.app{max-width:960px;margin:auto;padding:22px 14px 60px}.hero{padding:22px 8px 18px}.kicker{font-size:11px;letter-spacing:.15em;font-weight:900;color:#0c9863}.hero h1{margin:3px 0;font-size:clamp(34px,8vw,58px);line-height:1}.hero h1 span{color:var(--green)}.hero p{margin:8px 0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);background:white;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px #234b6515}.stat{text-align:center;padding:14px}.stat strong{display:block;font-size:22px;color:#0a9360}.stat span{font-size:11px;color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:18px 0;padding:6px;border-radius:16px;background:#e2edf3}.tab{border:0;padding:11px;border-radius:11px;background:transparent;color:#506b80;font-weight:800}.tab.active{background:var(--green);color:white}.view{display:none}.view.active{display:block}.weeknav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin-bottom:12px}.weeknav button,.weeknav select{height:44px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font-weight:800}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:12px 0}.day{border:1px solid var(--line);border-radius:12px;padding:9px 3px;background:white;color:#476379;font-size:11px;font-weight:800}.day.active{background:#e6f8f0;color:#08754e;border:2px solid var(--green)}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 30px #234b6514}.dayhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5edf1;padding-bottom:12px}.dayhead h2{margin:0}.pill{background:#e6f8f0;color:#09794f;border-radius:99px;padding:5px 9px;font-weight:800;font-size:11px}.motivation{display:flex;gap:12px;margin:15px 0;padding:14px;border-radius:15px;background:linear-gradient(135deg,#e8faf2,#edf6fc);color:#3d6076}.motivation b{color:#087950}.workout{display:flex;gap:11px;align-items:flex-start;padding:13px;margin:10px 0;background:#f5f9fb;border:1px solid #dfe8ee;border-radius:14px}.workout input{width:20px;height:20px;accent-color:var(--green)}.workout b{display:block}.details{font-size:12px;color:var(--muted);margin-top:3px}.weightbox{padding:15px;margin:14px 0;border:1px solid #ccdee8;border-radius:16px;background:#f5fafe}.weightrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin-top:10px}.weightrow input,input,textarea,select{min-width:0;padding:11px;border:1px solid #bfd1dc;border-radius:10px;background:white;color:var(--ink)}.weightrow button,.primary{border:0;border-radius:10px;padding:11px 14px;background:var(--blue);color:white;font-weight:800}.saved{font-size:12px;color:#078154;margin-top:6px}.strengthTitle{margin:22px 0 10px}.strengthGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.exercise{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:white;box-shadow:0 8px 23px #234b6512}.exercise img{display:block;width:100%;aspect-ratio:1.35/1;object-fit:cover;background:#e9f2f6}.exerciseBody{padding:14px}.exerciseTop{display:flex;justify-content:space-between;gap:8px}.exercise h3{margin:0;font-size:15px}.badge{white-space:nowrap;background:#e5f0fb;color:#2668a3;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:900}.focus{font-size:12px;font-weight:800;color:#0a9461}.exercise p,.exercise li{font-size:12px;color:#536e82;line-height:1.45}.exercise details{background:#f3f8fa;padding:8px 10px;border-radius:10px}.exercise summary{cursor:pointer;color:#2e628c;font-weight:800;font-size:12px}.exercise ul{padding-left:18px}.progressHero{display:flex;justify-content:space-between;align-items:end;padding:16px 4px}.progressHero h2{font-size:30px;margin:3px 0}.total{padding:13px 17px;border-radius:17px;background:#e6f8f0;color:#087a51;text-align:right}.total strong,.total span{display:block}.weekScores{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.weekscore{padding:12px;border-radius:13px;background:#f4f8fa;border:1px solid #dce7ed}.scoretop{display:flex;justify-content:space-between}.scoretop strong{color:#078758}.track{height:8px;background:#dfe9ee;border-radius:9px;margin-top:8px;overflow:hidden}.track i{display:block;height:100%;background:var(--green)}.weightCard{margin-top:16px}.chart{overflow-x:auto;background:#f8fbfc;border:1px solid #dce7ed;border-radius:15px}.chart svg{display:block;width:100%;min-width:620px}.grid line{stroke:#dce7ed}.grid text,.axis text{fill:#6b8295;font-size:11px}.line polyline{fill:none;stroke:var(--blue);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.dots circle{fill:white;stroke:var(--green);stroke-width:4}.dots text{fill:var(--ink);font-size:11px;font-weight:800}.weekweights{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:11px}.weekweights div{display:flex;flex-direction:column;padding:10px;background:#f4f8fa;border-radius:11px}.weekweights span{font-size:10px;color:var(--muted)}.food textarea{width:100%;min-height:120px}.food button{margin-top:10px}.note{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}@media(max-width:760px){.strengthGrid{grid-template-columns:1fr}.exercise{display:grid;grid-template-columns:120px 1fr}.exercise img{height:100%;aspect-ratio:auto}.days{overflow-x:auto}.day{min-width:54px}.weekweights{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr 1fr}.strengthGrid .exercise{display:block}.exercise img{height:auto;aspect-ratio:1.55/1}.weekScores{grid-template-columns:1fr}.weightrow{grid-template-columns:1fr auto}.weightrow button{grid-column:1/-1}.progressHero{align-items:flex-start}.total{padding:10px}.card{padding:15px}}
</style></head><body><main class="app"><header class="hero"><div class="kicker">8-WEEK CHALLENGE</div><h1>Road to <span>Sub 40</span></h1><p>Training, kracht, gewicht en voortgang in één licht trainingslogboek.</p></header><section class="stats"><div class="stat"><strong>42:20</strong><span>PR</span></div><div class="stat"><strong>39:59</strong><span>DOEL</span></div><div class="stat"><strong>3:59</strong><span>PER KM</span></div></section><nav class="tabs"><button class="tab active" data-tab="training">Training</button><button class="tab" data-tab="food">Voeding</button><button class="tab" data-tab="progress">Voortgang</button></nav><section id="training" class="view active"><div class="weeknav"><button id="prev">‹</button><select id="week"></select><button id="next">›</button></div><div id="days" class="days"></div><div id="trainingPanel"></div></section><section id="food" class="view food"><div class="card"><h2>Voeding</h2><p class="details">Vrije notities voor voeding, drinken en herstel.</p><textarea id="foodNote" placeholder="Wat ging goed? Wat wil je aanpassen?"></textarea><button id="saveFood" class="primary">Opslaan</button><div id="foodSaved" class="saved"></div></div></section><section id="progress" class="view"><div id="progressPanel"></div></section><p class="note">Gegevens worden alleen lokaal op dit apparaat opgeslagen.</p></main><script>
const DAYS=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];const ICON=['🏋️','🏃','🔥','🏋️','🌿','🏃','🛌'];const MOT=['Vandaag hoef je niet perfect te trainen, alleen te beginnen.','Rustige kilometers bouwen de basis voor snelle kilometers.','Loop het blok dat voor je ligt, niet de hele training tegelijk.','Sterke benen maken het tempo van morgen makkelijker.','Herstel is training: vandaag laad je op voor wat komt.','De duurloop wordt gewonnen door geduld, niet door haast.','Consistentie over acht weken is sterker dan één perfecte dag.'];
const RUN=[['Kracht','8 km rustig','3 × 8 min @ 4:15–4:20/km','Kracht','Rust of 5–7 km rustig','12 km rustig','Rust / herstel'],['Kracht','9 km rustig','4 × 6 min @ 4:10–4:15/km','Kracht','6 km rustig','13 km rustig','Rust / herstel'],['Kracht','8 km rustig','5 × 1 km @ 4:05–4:10/km','Kracht','Rust','14 km rustig','Herstel'],['Kracht','10 km rustig','2 × 12 min @ 4:10/km','Kracht','6 km rustig','12 km progressief','Rust'],['Kracht','9 km rustig','6 × 1 km @ 4:00–4:05/km','Kracht','Rust','15 km rustig','Herstel'],['Kracht','10 km rustig','3 × 10 min @ 4:05/km','Kracht','6 km rustig','13 km met 4 km tempo','Rust'],['Kracht','8 km rustig','4 × 1,5 km @ 4:00–4:05/km','Kracht','Rust','12 km rustig','Herstel'],['Lichte kracht','7 km rustig','3 × 5 min @ 4:00/km','Lichte kracht / mobiliteit','Rust','5 km loslopen','10 km test']];
const E={squat:{n:'Back squat',i:'ex-squat.png',s:'3 × 6–8',f:'Bovenbenen en billen',h:'Zak gecontroleerd met de borst omhoog en duw via de hele voet terug.',t:['Knieën volgen de tenen','Rug neutraal','Stop vóór techniekverlies']},front:{n:'Front squat',i:'ex-squat.png',s:'3 × 6–8',f:'Quadriceps en romp',h:'Houd het gewicht voor het lichaam en blijf rechterop tijdens het zakken.',t:['Ellebogen hoog','Hele voet belast','Rustige diepte']},goblet:{n:'Goblet squat',i:'ex-goblet.png',s:'3 × 8–10',f:'Benen, billen en romp',h:'Houd één dumbbell voor de borst en squat tussen de knieën.',t:['Gewicht dicht bij borst','Knieën naar buiten','Volledige voet op vloer']},sumo:{n:'Sumo squat',i:'ex-squat.png',s:'3 × 8–10',f:'Benen, billen en binnenbeen',h:'Sta breder met tenen licht naar buiten en zak recht omlaag.',t:['Knieën volgen tenen','Borst omhoog','Niet overmatig breed']},bulgarian:{n:'Bulgarian split squat',i:'ex-bulgarian.png',s:'3 × 8 per been',f:'Eenzijdige beenkracht',h:'Plaats de achterste voet op een lage bank en zak op het voorste been.',t:['Begin zonder gewicht','Voorste knie stabiel','Comfortabele paslengte']},forward:{n:'Forward lunge',i:'ex-reverse-lunge.png',s:'3 × 8 per been',f:'Benen en stabiliteit',h:'Stap voorwaarts, zak gecontroleerd en duw terug naar de start.',t:['Lange genoeg stap','Romp rechtop','Knie volgt voet']},reverse:{n:'Reverse lunge',i:'ex-reverse-lunge.png',s:'3 × 8 per been',f:'Billen en kniestabiliteit',h:'Stap achterwaarts en zak recht omlaag op het voorste been.',t:['Druk door voorste voet','Bekken recht','Rustig terug']},walking:{n:'Walking lunge',i:'ex-walking-lunge.png',s:'3 × 10 stappen',f:'Benen, billen en coördinatie',h:'Wissel vloeiend van been en houd elke landing stabiel.',t:['Controle vóór snelheid','Romp lang','Knie niet naar binnen']},hip:{n:'Hip thrust',i:'ex-hipthrust.png',s:'3 × 8–10',f:'Bilspieren en heupstrekking',h:'Steun met de bovenrug op een bank en strek de heupen tot romp en bovenbenen één lijn vormen.',t:['Kin licht ingetrokken','Billen bovenaan aanspannen','Onderrug niet overstrekken']},singlehip:{n:'Single-leg hip thrust',i:'ex-hipthrust.png',s:'3 × 8 per been',f:'Eenzijdige bilkracht',h:'Voer de hip thrust uit met één voet op de vloer en het andere been vrij.',t:['Bekken horizontaal','Klein beginnen','Volledige controle']},incline:{n:'Incline leg press',i:'ex-incline-legpress.png',s:'3 × 8–10',f:'Bovenbenen en billen',h:'Plaats de voeten op schouderbreedte en laat het platform beheerst zakken.',t:['Knieën niet op slot','Onderrug blijft tegen zitting','Duw via hele voet']},legpress:{n:'Leg press',i:'ex-legpress.png',s:'3 × 10',f:'Bovenbenen en billen',h:'Duw de plaat weg zonder de knieën volledig te vergrendelen.',t:['Bekken blijft zitten','Knieën volgen tenen','Geen stuiter onderin']},extension:{n:'Leg extension',i:'ex-legextension.png',s:'3 × 10–12',f:'Quadriceps',h:'Duw de rol met de schenen naar voren en omhoog, en zak langzaam terug.',t:['Knieas bij draaipunt','Niet zwaaien','Pauze bovenaan']},abductor:{n:'Hip abductor machine',i:'ex-abductor.png',s:'3 × 12–15',f:'Buitenzijde heup en billen',h:'Duw de kniesteunen gecontroleerd naar buiten en laat langzaam terugkomen.',t:['Rug tegen leuning','Geen momentum','Beweging uit de heup']},calf:{n:'Standing machine calf raise',i:'ex-standing-calf.png',s:'3 × 12–15',f:'Kuitkracht',h:'Kom onder de schoudersteunen hoog op de voorvoeten en zak gecontroleerd.',t:['Volledige beweging','Knieën zacht','Niet veren']}};
const ROT=[[['squat','hip','calf'],['bulgarian','incline','abductor']],[['goblet','incline','calf'],['reverse','extension','hip']],[['front','legpress','abductor'],['walking','hip','calf']],[['sumo','incline','extension'],['bulgarian','singlehip','calf']],[['squat','legpress','calf'],['forward','hip','abductor']],[['goblet','extension','calf'],['reverse','legpress','hip']],[['front','incline','abductor'],['walking','hip','calf']],[['sumo','extension','calf'],['reverse','singlehip','abductor']]];
const get=(k,d='')=>{try{let v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let w=+get('selectedWeek',1),d=+get('selectedDay',0);const $=x=>document.getElementById(x);for(let x=1;x<=8;x++)$('week').add(new Option(`Week ${x}`,x));$('week').value=w;
function exerciseCard(k){let x=E[k];return `<article class="exercise"><img src="${x.i}" alt="Illustratie ${x.n}" loading="lazy"><div class="exerciseBody"><div class="exerciseTop"><h3>${x.n}</h3><span class="badge">${x.s}</span></div><p class="focus">${x.f}</p><p>${x.h}</p><details><summary>Techniektips</summary><ul>${x.t.map(t=>`<li>${t}</li>`).join('')}</ul></details></div></article>`}
function renderTraining(){set('selectedWeek',w);set('selectedDay',d);$('week').value=w;$('days').innerHTML=DAYS.map((x,i)=>`<button class="day ${i===d?'active':''}" onclick="d=${i};renderTraining()">${x.slice(0,2).toUpperCase()}</button>`).join('');let done=get(`act-${w}-${d}`,false),html=`<article class="card"><div class="dayhead"><h2>${ICON[d]} ${DAYS[d]}</h2><span class="pill">week ${w}</span></div><div class="motivation"><span>✦</span><div><b>Motivatie van vandaag</b><div>${MOT[d]}</div></div></div>`;if(d===2||d===5){let v=get(`weight-${w}-${d}`,'');html+=`<section class="weightbox"><b>⚖ Wekelijks weegmoment</b><div class="details">${DAYS[d]} · week ${w}</div><div class="weightrow"><input id="weightInput" type="number" step="0.1" value="${v}" placeholder="Bijv. 78,4"><span>kg</span><button onclick="saveWeight()">Opslaan</button></div><div id="weightSaved" class="saved"></div></section>`}html+=`<label class="workout"><input type="checkbox" ${done?'checked':''} onchange="set('act-${w}-${d}',this.checked)"><span><b>${RUN[w-1][d]}</b><span class="details">Vink af wanneer de geplande training van deze dag is volbracht.</span></span></label>`;if(d===0||d===3){let setIndex=d===0?0:1;html+=`<h2 class="strengthTitle">Voorgestelde krachtoefeningen</h2><div class="strengthGrid">${ROT[w-1][setIndex].map(exerciseCard).join('')}</div>`}html+='</article>';$('trainingPanel').innerHTML=html}
function saveWeight(){let v=$('weightInput').value;if(v)set(`weight-${w}-${d}`,v);else localStorage.removeItem(`weight-${w}-${d}`);$('weightSaved').textContent=v?'✓ Gewicht opgeslagen':'Gewicht verwijderd'}function avg(i){let a=parseFloat(get(`weight-${i}-2`,'')),b=parseFloat(get(`weight-${i}-5`,''));return Number.isFinite(a)&&Number.isFinite(b)?Math.round((a+b)/2*10)/10:null}function daysDone(i){let n=0;for(let x=0;x<7;x++)if(get(`act-${i}-${x}`,false)||get(`act-${i}-${x}-0`,false))n++;return n}
function chart(vals){let good=vals.filter(v=>v!=null);let lo=good.length?Math.min(...good)-.5:70,hi=good.length?Math.max(...good)+.5:80;if(lo===hi){lo--;hi++}let W=760,H=260,L=55,R=25,T=28,B=42,X=i=>L+i*(W-L-R)/7,Y=v=>T+(hi-v)*(H-T-B)/(hi-lo),grid=[0,.25,.5,.75,1].map(f=>{let y=T+f*(H-T-B),n=(hi-f*(hi-lo)).toFixed(1);return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${n}</text>`}).join(''),seg=[],cur=[];vals.forEach((v,i)=>{if(v!=null)cur.push(`${X(i)},${Y(v)}`);else if(cur.length){seg.push(cur);cur=[]}});if(cur.length)seg.push(cur);return `<div class="chart"><svg viewBox="0 0 ${W} ${H}"><g class="grid">${grid}</g><g class="line">${seg.map(a=>`<polyline points="${a.join(' ')}"/>`).join('')}</g><g class="dots">${vals.map((v,i)=>v==null?'':`<circle cx="${X(i)}" cy="${Y(v)}" r="6"/><text x="${X(i)}" y="${Y(v)-12}" text-anchor="middle">${String(v).replace('.',',')} kg</text>`).join('')}</g><g class="axis">${vals.map((_,i)=>`<text x="${X(i)}" y="${H-14}" text-anchor="middle">W${i+1}</text>`).join('')}</g></svg></div>`}
function renderProgress(){let c=Array.from({length:8},(_,i)=>daysDone(i+1)),a=Array.from({length:8},(_,i)=>avg(i+1)),total=c.reduce((x,y)=>x+y,0);$('progressPanel').innerHTML=`<div class="progressHero"><div><div class="kicker">8-WEEK OVERVIEW</div><h2>Jouw voortgang</h2><p>Alle weken direct in beeld.</p></div><div class="total"><strong>${total}/56</strong><span>dagen voltooid</span></div></div><article class="card"><h2>Succesvolle dagen per week</h2><div class="weekScores">${c.map((n,i)=>`<div class="weekscore"><div class="scoretop"><b>Week ${i+1}</b><strong>${n}/7</strong></div><div class="track"><i style="width:${n/7*100}%"></i></div></div>`).join('')}</div></article><article class="card weightCard"><h2>Gemiddeld gewicht per week</h2><p class="details">Gemiddelde van woensdag en zaterdag. De lijngrafiek blijft altijd zichtbaar.</p>${chart(a)}<div class="weekweights">${a.map((v,i)=>`<div><b>Week ${i+1}</b><strong>${v==null?'–':String(v).replace('.',',')+' kg'}</strong><span>wo ${get(`weight-${i+1}-2`,'–')} · za ${get(`weight-${i+1}-5`,'–')}</span></div>`).join('')}</div></article>`}
$('prev').onclick=()=>{if(w>1){w--;renderTraining()}};$('next').onclick=()=>{if(w<8){w++;renderTraining()}};$('week').onchange=e=>{w=+e.target.value;renderTraining()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');if(b.dataset.tab==='progress')renderProgress()});$('foodNote').value=get('foodNote','');$('saveFood').onclick=()=>{set('foodNote',$('foodNote').value);$('foodSaved').textContent='✓ Notitie opgeslagen'};renderTraining();renderProgress();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=13'));
</script></body></html>
