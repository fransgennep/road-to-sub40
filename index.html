</style></head><body><main class="app"><header><div class="green" style="font-size:12px;font-weight:900;letter-spacing:1.5px">8-WEEK CHALLENGE</div><h1>ROAD TO <span class="green">SUB 40</span></h1><div class="muted">Training, kracht, voeding en herstel in één logboek</div></header><section class="hero"><div class="stats"><div><b>42:20</b><small>PR</small></div><div><b>39:59</b><small>DOEL</small></div><div><b>3:59</b><small>PER KM</small></div></div></section><nav class="tabs"><button class="active" data-tab="training">Training</button><button data-tab="food">Voeding</button><button data-tab="progress">Voortgang</button></nav>
<section id="training" class="view active"><div class="bar"><button onclick="stepWeek(-1)">‹</button><select class="weekSelect"></select><button onclick="stepWeek(1)">›</button></div><div id="trainingDays"></div></section>
<section id="food" class="view"><div class="bar"><button onclick="stepFoodWeek(-1)">‹</button><select id="foodWeek"></select><button onclick="stepFoodWeek(1)">›</button></div><div class="bar"><select id="foodDay"></select></div><div id="foodPanel"></div></section>
<section id="progress" class="view"><div class="bar"><button onclick="stepProgressWeek(-1)">‹</button><select id="progressWeek"></select><button onclick="stepProgressWeek(1)">›</button></div><div class="bar"><select id="progressDay"></select></div><div id="progressPanel"></div></section><div class="foot">Gegevens worden alleen lokaal op dit apparaat opgeslagen.</div></main><script>
const D=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'],I=['🏋️','🏃','🔥','🏋️','🌿','🏃','🛌'];

const FOOD=[
[['Ontbijt','Overnight oats',['havermout 70 g','melk 250 ml','kwark 150 g','banaan']],['Lunch','Volkoren kipwraps',['2 volkoren wraps','kip 150 g','paprika','sla']],['Avond','Rijstbowl met zalm',['rijst 100 g','zalm 150 g','broccoli']]],
[['Ontbijt','Havermout met appel',['havermout 70 g','melk 250 ml','appel']],['Lunch','Brood met eieren',['4 volkoren boterhammen','2 eieren','tomaat']],['Avond','Volkoren pasta',['pasta 100 g','mager gehakt of linzen 150 g','passata']]],
[['Ontbijt','Ruime havermout',['havermout 80 g','melk 300 ml','banaan','honing']],['Lunch','Rijst met kip',['rijst 110 g','kip 150 g','groentemix']],['Voor training','Snelle koolhydraten',['2 boterhammen','jam','banaan']],['Herstel','Kwark met fruit',['kwark 250 g','fruit']]],
[['Ontbijt','Kwarkbowl',['kwark 300 g','muesli 50 g','bessen']],['Lunch','Tonijnsandwich',['4 volkoren boterhammen','tonijn','sla']],['Avond','Zoete aardappel met kip',['zoete aardappel 350 g','kip 170 g','boontjes']]],
[['Ontbijt','Brood met banaan',['4 volkoren boterhammen','pindakaas','banaan']],['Lunch','Pastasalade',['pasta 100 g','tonijn of kikkererwten','groenten']],['Avond','Wrapbowl',['rijst 100 g','kip of tofu 150 g','bonen','sla']]],
[['Voor duurloop','Ontbijt 2–3 uur vooraf',['3 boterhammen','banaan','jam','water']],['Na duurloop','Herstelbowl',['havermout 70 g','melk 250 ml','kwark 250 g','bessen']],['Avond','Curry met rijst',['rijst 110 g','kip of tofu 150 g','currygroenten']]],
[['Ontbijt','Yoghurtbowl',['yoghurt 250 g','muesli 50 g','fruit']],['Lunch','Soep en brood',['groentesoep','3 volkoren boterhammen','hüttenkäse']],['Avond','Traybake',['aardappelen 350 g','kip of tofu 150 g','veel groenten']]]];
const get=(k,f)=>{try{let v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch{return f}},set=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function plan(w){return [['Kracht'],['8 km rustig'],[Q[w-1]],['Kracht'],['Rust of optioneel 5–7 km rustig'],[L[w-1]],['Rust / herstel']]}function fillWeeks(sel){for(let i=1;i<=8;i++)sel.add(new Option('Week '+i,i))}document.querySelectorAll('.weekSelect').forEach(fillWeeks);fillWeeks(foodWeek);fillWeeks(progressWeek);D.forEach((x,i)=>{foodDay.add(new Option(x,i));progressDay.add(new Option(x,i))});document.querySelector('.weekSelect').value=get('uiWeek',1);
function stepWeek(n){let s=document.querySelector('.weekSelect');s.value=Math.max(1,Math.min(8,+s.value+n));s.onchange()}function stepFoodWeek(n){foodWeek.value=Math.max(1,Math.min(8,+foodWeek.value+n));renderFood()}function stepProgressWeek(n){progressWeek.value=Math.max(1,Math.min(8,+progressWeek.value+n));renderProgress()}
let selectedDay=0;
const SUG={0:[['Squat','3 × 6–8','Been- en bilkracht'],['Romanian deadlift','3 × 8','Hamstrings/heupkracht'],['Standing calf raise','3 × 12–15','Kuitbelastbaarheid']],3:[['Bulgarian split squat','3 × 8 per been','Eenzijdige beenkracht'],['Hip thrust','3 × 8–10','Bilspieren/heupstrekking'],['Seated calf raise','3 × 12–15','Soleus/kuitkracht']]};
function renderTraining(){let w=+document.querySelector('.weekSelect').value,p=plan(w);let overview=`<div class="weekOverview">${p.map((acts,d)=>{let ok=get(`act-${w}-${d}-0`,false);return `<button class="weekDay ${selectedDay===d?'active':''} ${ok?'doneDay':''}" onclick="selectedDay=${d};renderTraining()"><span class="dow">${D[d].slice(0,2).toUpperCase()}</span><span class="ico">${I[d]}</span><span class="ttl">${esc(acts[0])}</span></button>`}).join('')}</div>`;
let d=selectedDay,acts=p[d],html=`<article class="card dayDetail"><div class="dayhead"><h3>${I[d]} ${D[d]}</h3><span class="pill">week ${w}</span></div>`;acts.forEach((a,i)=>{let k=`act-${w}-${d}-${i}`,ok=get(k,false);html+=`<label class="activity"><input type="checkbox" ${ok?'checked':''} onchange="set('${k}',this.checked);renderTraining()"><div class="${ok?'done':''}"><b>${a}</b>${d===2?'<div class="details">10–15 min inlopen + kern + uitlopen · max. 60 min</div>':''}</div></label>`});if(d===2)html+=trainingResultBox(w,d);if(SUG[d]){html+=`<div class="hint">Voorgestelde beenoefeningen</div><div class="strengthSuggestions">${SUG[d].map(x=>`<div class="strengthSuggestion"><b>${x[0]}</b>${x[1]}<div class="details">${x[2]}</div></div>`).join('')}</div>`;let strength=get(`str-${w}-${d}`,[]);strength.forEach((x,i)=>html+=strengthNote(x,w,d,i));html+=strengthForm(w,d)}html+=`</article>`;
let extras=get(`weekly-extra-${w}`,[]);html+=`<article class="card extraCard"><div class="dayhead"><h3>＋ Extra activiteiten</h3><span class="pill">week ${w}</span></div><div class="details">Voor alles buiten het sub-40-schema, zoals padel, voetbal, wandelen of fietsen.</div>${extras.map((x,i)=>`<div class="log"><div class="logtop"><b>${esc(x.name)}</b><button class="danger" onclick="removeItem('weekly-extra-${w}',${i});renderTraining()">×</button></div><div class="details">${esc(x.note)}</div></div>`).join('')}<button class="linkbtn" onclick="toggle('weekly-extra-form')">＋ Activiteit toevoegen</button><div class="form" id="weekly-extra-form"><input id="weekly-extra-name" placeholder="Bijv. Padel"><div class="field"><textarea id="weekly-extra-note" placeholder="Dag, duur, afstand of notitie"></textarea></div><button class="primary" onclick="saveWeeklyExtra(${w})">Opslaan</button></div></article>`;trainingDays.innerHTML=overview+html}
const PLANNED_WORK=[24,20.4,24.8,24.3,24.4,19.8,24,11.8],RESULT_REASONS=[['fatigue','Benen/vermoeidheid'],['pace','Tempo te zwaar'],['weather','Weer/omstandigheden'],['injury','Pijn/blessure'],['mental','Mentaal'],['time','Tijdgebrek'],['other','Anders']];
function resultKey(w,d){return `result-${w}-${d}`}
function timeSeconds(v){let x=String(v||'').trim().replace(',',':').split(':').map(Number);return x.length===2&&x.every(Number.isFinite)?x[0]*60+x[1]:(Number(v)||0)*60}
function resultCalculation(v){let actual=(v.blocks||[]).reduce((n,x)=>n+timeSeconds(x),0),planned=(Number(v.plannedMinutes)||0)*60,pct=planned?Math.min(100,Math.round(actual/planned*100)):0;return{actual,pct,label:`${Math.floor(actual/60)}:${String(Math.round(actual%60)).padStart(2,'0')} van ${Number(v.plannedMinutes||0).toString().replace('.',',')} min`}}
function trainingResultBox(w,d){let k=resultKey(w,d),v=get(k,{status:'',plannedMinutes:PLANNED_WORK[w-1],blocks:[],paceHit:false,reasons:[],note:'',saved:false}),show=v.status==='partial'||v.status==='missed',calc=resultCalculation(v),statusLabel=v.status==='complete'?'✅ Voltooid':v.status==='partial'?'🟠 Gedeeltelijk':'❌ Niet uitgevoerd';if(v.saved){let reasonLabels=RESULT_REASONS.filter(x=>(v.reasons||[]).includes(x[0])).map(x=>x[1]).join(', ');return `<div class="resultBox"><div class="hint">TRAININGSRESULTAAT</div><div class="resultCompact"><div class="resultCompactTop"><span class="big">${statusLabel}</span>${v.blocks&&v.blocks.length?`<b>${calc.pct}%</b>`:''}</div><div class="meta">${v.blocks&&v.blocks.length?`Uitvoering: ${calc.label}<br>`:''}Doeltempo gehaald: ${v.paceHit?'ja':'nee'}${reasonLabels?`<br>Reden: ${esc(reasonLabels)}`:''}${v.note?`<br>Notitie: ${esc(v.note)}`:''}</div><button class="editResult" onclick="editTrainingResult(${w},${d})">✎ Bewerken</button></div></div>`}return `<div class="resultBox"><div class="hint">TRAININGSRESULTAAT</div><b>Hoe ging de tempotraining?</b><div class="resultStatus">${[['complete','✅ Voltooid'],['partial','🟠 Gedeeltelijk'],['missed','❌ Niet uitgevoerd']].map(x=>`<button class="${v.status===x[0]?'active':''}" data-status="${x[0]}" onclick="setResultStatus(${w},${d},'${x[0]}')">${x[1]}</button>`).join('')}</div><div class="resultFields ${show?'open':''}"><div class="grid2"><div class="field"><label>Geplande tempominuten</label><input id="plannedMinutes" type="number" min="0" step="0.1" value="${esc(v.plannedMinutes)}"></div><div class="field"><label>Werkelijke blokken</label><input id="actualBlocks" value="${esc((v.blocks||[]).join(', '))}" placeholder="6:30, 8:00, 2:00"></div></div><div class="hint">Vul de gelopen blokken in als minuten:seconden, gescheiden door komma's.</div><label class="paceCheck"><input id="paceHit" type="checkbox" ${v.paceHit?'checked':''}> Doeltempo tijdens de gelopen blokken gehaald</label><div class="field"><label>Waarom niet volledig?</label><div class="reasonGrid">${RESULT_REASONS.map(x=>`<label><input type="checkbox" name="resultReason" value="${x[0]}" ${(v.reasons||[]).includes(x[0])?'checked':''}> ${x[1]}</label>`).join('')}</div></div><div class="field"><label>Notitie</label><textarea id="resultNote" placeholder="Bijv. koud, baan glad; tempo voelde haalbaar...">${esc(v.note)}</textarea></div>${v.blocks&&v.blocks.length?`<div class="resultSummary"><b>Uitvoering: ${calc.pct}%</b><br>${calc.label} · doeltempo: ${v.paceHit?'ja':'nee'}</div>`:''}<button class="primary" onclick="saveTrainingResult(${w},${d})">Trainingsresultaat opslaan</button></div></div>`}
function editTrainingResult(w,d){let v=get(resultKey(w,d),{});v.saved=false;set(resultKey(w,d),v);renderTraining()}
function setResultStatus(w,d,status){let v=get(resultKey(w,d),{});v.status=status;if(v.plannedMinutes==null)v.plannedMinutes=PLANNED_WORK[w-1];set(resultKey(w,d),v);if(status==='complete')set(`act-${w}-${d}-0`,true);else set(`act-${w}-${d}-0`,false);renderTraining()}
function saveTrainingResult(w,d){let v=get(resultKey(w,d),{});v.plannedMinutes=+document.querySelector('#plannedMinutes').value||0;v.blocks=document.querySelector('#actualBlocks').value.split(',').map(x=>x.trim()).filter(Boolean);v.paceHit=document.querySelector('#paceHit').checked;v.reasons=[...document.querySelectorAll('input[name="resultReason"]:checked')].map(x=>x.value);v.note=document.querySelector('#resultNote').value.trim();if(!v.status)v.status='partial';v.saved=true;set(resultKey(w,d),v);set(`act-${w}-${d}-0`,v.status==='complete');renderTraining()}
function saveWeeklyExtra(w){let name=document.querySelector('#weekly-extra-name').value.trim();if(!name)return;let k=`weekly-extra-${w}`,a=get(k,[]);a.push({name,note:document.querySelector('#weekly-extra-note').value.trim()});set(k,a);renderTraining()}
function strengthNote(x,w,d,i){return `<div class="log"><div class="logtop"><div><b>🏋️ ${esc(x.exercise)}</b><div class="details">${x.sets.length} sets · ${esc(x.note)}</div></div><button class="danger" onclick="removeItem('str-${w}-${d}',${i});renderTraining()">×</button></div><ol class="sets">${x.sets.map((s,j)=>`<li>Set ${j+1}: ${s.reps} herhalingen × ${s.weight} kg</li>`).join('')}</ol></div>`}
function strengthForm(w,d){return `<button class="linkbtn" onclick="toggle('strform-${d}')">＋ Krachtoefening toevoegen</button><div class="form" id="strform-${d}"><div class="grid2"><input id="ex-${d}" placeholder="Oefening, bijv. Squat"><select id="sc-${d}" onchange="drawSets(${d})">${[1,2,3,4,5,6].map(n=>`<option ${n===3?'selected':''}>${n}</option>`).join('')}</select></div><div class="hint">Aantal sets</div><div id="sets-${d}"></div><textarea id="sn-${d}" placeholder="Notitie, bijv. techniek voelde goed"></textarea><button class="primary" onclick="saveStrength(${w},${d})">Oefening opslaan</button></div>`}
function drawSets(d){let n=+document.querySelector(`#sc-${d}`).value,el=document.querySelector(`#sets-${d}`);el.innerHTML=Array.from({length:n},(_,i)=>`<div class="setrow"><span>Set ${i+1}</span><input type="number" min="0" id="rep-${d}-${i}" placeholder="Herhalingen"><input type="number" min="0" step="0.5" id="kg-${d}-${i}" placeholder="Gewicht kg"></div>`).join('')}
function saveStrength(w,d){let ex=document.querySelector(`#ex-${d}`).value.trim(),n=+document.querySelector(`#sc-${d}`).value;if(!ex)return alert('Vul een oefening in.');let sets=Array.from({length:n},(_,i)=>({reps:+document.querySelector(`#rep-${d}-${i}`).value||0,weight:+document.querySelector(`#kg-${d}-${i}`).value||0}));let k=`str-${w}-${d}`,a=get(k,[]);a.push({exercise:ex,sets,note:document.querySelector(`#sn-${d}`).value.trim()});set(k,a);renderTraining()}
function saveAlt(w,d){let name=document.querySelector(`#an-${d}`).value.trim();if(!name)return;let k=`alt-${w}-${d}`,a=get(k,[]);a.push({name,note:document.querySelector(`#at-${d}`).value.trim()});set(k,a);renderTraining()}function removeItem(k,i){let a=get(k,[]);a.splice(i,1);set(k,a)}function toggle(id){let e=document.querySelector('#'+id);e.classList.toggle('open');if(id.startsWith('strform')&&e.classList.contains('open'))drawSets(+id.split('-')[1])}
function renderFood(){let w=+foodWeek.value,d=+foodDay.value,k=`food-${w}-${d}`,v=get(k,{alcohol:0,note:''});foodPanel.innerHTML=`<article class="card"><div class="dayhead"><h3>🥗 ${D[d]}</h3><span class="pill">week ${w}</span></div>${FOOD[d].map(m=>`<div class="meal"><div class="hint">${m[0]}</div><b>${m[1]}</b><div class="ingredients">${m[2].map(x=>`<span class="ingredient">${x}</span>`).join('')}</div></div>`).join('')}</article><article class="card"><h3>Dagregistratie</h3><div class="field"><label>Alcoholische drankjes</label><div class="alcohol"><button onclick="alcohol(-1)">−</button><b id="alc">${v.alcohol}</b><button onclick="alcohol(1)">＋</button></div></div><div class="field"><label>Notitie over extra gegeten of juist niet gegeten</label><textarea id="foodNote" placeholder="Bijv. extra dessert, lunch overgeslagen…">${esc(v.note)}</textarea></div><button class="primary" onclick="saveFood()">Dag opslaan</button><div id="foodSaved" class="saved"></div></article>`}
function alcohol(n){alc.textContent=Math.max(0,+alc.textContent+n)}function saveFood(){let k=`food-${foodWeek.value}-${foodDay.value}`;set(k,{alcohol:+alc.textContent,note:foodNote.value.trim()});foodSaved.textContent='✓ Opgeslagen'}
function renderProgress(){let w=+progressWeek.value,d=+progressDay.value,k=`prog-${w}-${d}`,v=get(k,{weight:'',vo2:'',complaints:''});progressPanel.innerHTML=`<article class="card"><div class="dayhead"><h3>📈 ${D[d]}</h3><span class="pill">week ${w}</span></div><div class="metric"><label>Gewicht (kg)</label><input id="weight" type="number" step="0.1" value="${esc(v.weight)}" placeholder="Bijv. 78,4"></div><div class="metric"><label>VO₂ max</label><input id="vo2" type="number" step="0.1" value="${esc(v.vo2)}" placeholder="Bijv. 52"></div><div class="metric"><label>Eventuele klachten</label><textarea id="complaints" placeholder="Bijv. lichte spanning linker kuit">${esc(v.complaints)}</textarea></div><button class="primary" onclick="saveProgress()">Dag opslaan</button><div id="progSaved" class="saved"></div>${v.weight||v.vo2||v.complaints?`<div class="summary"><b>Opgeslagen notitie</b>\nGewicht: ${esc(v.weight)||'–'} kg\nVO₂ max: ${esc(v.vo2)||'–'}\nKlachten: ${esc(v.complaints)||'geen'}</div>`:''}</article>`}
function saveProgress(){let k=`prog-${progressWeek.value}-${progressDay.value}`;set(k,{weight:weight.value,vo2:vo2.value,complaints:complaints.value.trim()});renderProgress();progSaved.textContent='✓ Opgeslagen'}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.tab).classList.add('active')});document.querySelector('.weekSelect').onchange=e=>{set('uiWeek',+e.target.value);renderTraining()};foodWeek.onchange=foodDay.onchange=renderFood;progressWeek.onchange=progressDay.onchange=renderProgress;renderTraining();renderFood();renderProgress();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=3'));
</script></body></html>
