]};
function renderTraining(){let w=+document.querySelector('.weekSelect').value,p=plan(w);let overview=`<div class="weekOverview">${p.map((acts,d)=>{let ok=get(`act-${w}-${d}-0`,false);return `<button class="weekDay ${selectedDay===d?'active':''} ${ok?'doneDay':''}" onclick="selectedDay=${d};renderTraining()"><span class="dow">${D[d].slice(0,2).toUpperCase()}</span><span class="ico">${I[d]}</span><span class="ttl">${esc(acts[0])}</span></button>`}).join('')}</div>`;
let d=selectedDay,acts=p[d],html=`<article class="card dayDetail"><div class="dayhead"><h3>${I[d]} ${D[d]}</h3><span class="pill">week ${w}</span></div>`;html+=`<div class="dailyMotivation"><span>✦</span><div><b>Motivatie van vandaag</b><p>${MOTIVATION[d]}</p></div></div>`;if(d===2||d===5)html+=weightMoment(w,d);acts.forEach((a,i)=>{let k=`act-${w}-${d}-${i}`,ok=get(k,false);html+=`<label class="activity"><input type="checkbox" ${ok?'checked':''} onchange="set('${k}',this.checked);renderTraining()"><div class="${ok?'done':''}"><b>${a}</b>${d===2?'<div class="details">10–15 min inlopen + kern + uitlopen · max. 60 min</div>':''}</div></label>`});if(d===2)html+=trainingResultBox(w,d);if(SUG[d]){html+=`<div class="hint">Voorgestelde beenoefeningen</div><div class="strengthSuggestions">${SUG[d].map((x,i)=>`<article class="exerciseGuide">${x.img?`<img src="${x.img}" alt="Illustratie van ${x.name}" loading="lazy">`:''}<div class="exerciseGuideBody"><div class="exerciseGuideTop"><div><span class="exerciseNumber">${i+1}</span><h4>${x.name}</h4></div><span class="setsBadge">${x.sets}</span></div><p class="exerciseFocus">${x.focus}</p><p>${x.how}</p><details><summary>Techniektips</summary><ul>${x.tips.map(t=>`<li>${t}</li>`).join('')}</ul></details></div></article>`).join('')}</div>`;let strength=get(`str-${w}-${d}`,[]);strength.forEach((x,i)=>html+=strengthNote(x,w,d,i));html+=strengthForm(w,d)}html+=`</article>`;
let extras=get(`weekly-extra-${w}`,[]);html+=`<article class="card extraCard"><div class="dayhead"><h3>＋ Extra activiteiten</h3><span class="pill">week ${w}</span></div><div class="details">Voor alles buiten het sub-40-schema, zoals padel, voetbal, wandelen of fietsen.</div>${extras.map((x,i)=>`<div class="log"><div class="logtop"><b>${esc(x.name)}</b><button class="danger" onclick="removeItem('weekly-extra-${w}',${i});renderTraining()">×</button></div><div class="details">${esc(x.note)}</div></div>`).join('')}<button class="linkbtn" onclick="toggle('weekly-extra-form')">＋ Activiteit toevoegen</button><div class="form" id="weekly-extra-form"><input id="weekly-extra-name" placeholder="Bijv. Padel"><div class="field"><textarea id="weekly-extra-note" placeholder="Dag, duur, afstand of notitie"></textarea></div><button class="primary" onclick="saveWeeklyExtra(${w})">Opslaan</button></div></article>`;trainingDays.innerHTML=overview+html}
const PLANNED_WORK=[24,20.4,24.8,24.3,24.4,19.8,24,11.8],RESULT_REASONS=[['fatigue','Benen/vermoeidheid'],['pace','Tempo te zwaar'],['weather','Weer/omstandigheden'],['injury','Pijn/blessure'],['mental','Mentaal'],['time','Tijdgebrek'],['other','Anders']];
function resultKey(w,d){return `result-${w}-${d}`}
function timeSeconds(v){let x=String(v||'').trim().replace(',',':').split(':').map(Number);return x.length===2&&x.every(Number.isFinite)?x[0]*60+x[1]:(Number(v)||0)*60}
function resultCalculation(v){let actual=(v.blocks||[]).reduce((n,x)=>n+timeSeconds(x),0),planned=(Number(v.plannedMinutes)||0)*60,pct=planned?Math.min(100,Math.round(actual/planned*100)):0;return{actual,pct,label:`${Math.floor(actual/60)}:${String(Math.round(actual%60)).padStart(2,'0')} van ${Number(v.plannedMinutes||0).toString().replace('.',',')} min`}}
function trainingResultBox(w,d){let k=resultKey(w,d),v=get(k,{status:'',plannedMinutes:PLANNED_WORK[w-1],blocks:[],paceHit:false,reasons:[],note:'',saved:false}),show=v.status==='partial'||v.status==='missed',calc=resultCalculation(v),statusLabel=v.status==='complete'?'✅ Voltooid':v.status==='partial'?'🟠 Gedeeltelijk':'❌ Niet uitgevoerd';if(v.saved){let reasonLabels=RESULT_REASONS.filter(x=>(v.reasons||[]).includes(x[0])).map(x=>x[1]).join(', ');return `<div class="resultBox"><div class="hint">TRAININGSRESULTAAT</div><div class="resultCompact"><div class="resultCompactTop"><span class="big">${statusLabel}</span>${v.blocks&&v.blocks.length?`<b>${calc.pct}%</b>`:''}</div><div class="meta">${v.blocks&&v.blocks.length?`<strong style="color:#fff;font-size:13px">Werkelijke blokken: ${esc((v.blocks||[]).join(' + '))}</strong><br>Uitvoering: ${calc.label} (${calc.pct}%)<br>`:''}Doeltempo gehaald: ${v.paceHit?'ja':'nee'}${reasonLabels?`<br>Reden: ${esc(reasonLabels)}`:''}${v.note?`<br>Notitie: ${esc(v.note)}`:''}</div><button class="editResult" onclick="editTrainingResult(${w},${d})">✎ Bewerken</button></div></div>`}return `<div class="resultBox"><div class="hint">TRAININGSRESULTAAT</div><b>Hoe ging de tempotraining?</b><div class="resultStatus">${[['complete','✅ Voltooid'],['partial','🟠 Gedeeltelijk'],['missed','❌ Niet uitgevoerd']].map(x=>`<button class="${v.status===x[0]?'active':''}" data-status="${x[0]}" onclick="setResultStatus(${w},${d},'${x[0]}')">${x[1]}</button>`).join('')}</div><div class="resultFields ${show?'open':''}"><div class="grid2"><div class="field"><label>Geplande tempominuten</label><input id="plannedMinutes" type="number" min="0" step="0.1" value="${esc(v.plannedMinutes)}"></div><div class="field"><label>Werkelijke blokken</label><input id="actualBlocks" value="${esc((v.blocks||[]).join(', '))}" placeholder="6:30, 8:00, 2:00"></div></div><div class="hint">Vul de gelopen blokken in als minuten:seconden, gescheiden door komma's.</div><label class="paceCheck"><input id="paceHit" type="checkbox" ${v.paceHit?'checked':''}> Doeltempo tijdens de gelopen blokken gehaald</label><div class="field"><label>Waarom niet volledig?</label><div class="reasonGrid">${RESULT_REASONS.map(x=>`<label><input type="checkbox" name="resultReason" value="${x[0]}" ${(v.reasons||[]).includes(x[0])?'checked':''}> ${x[1]}</label>`).join('')}</div></div><div class="field"><label>Notitie</label><textarea id="resultNote" placeholder="Bijv. koud, baan glad; tempo voelde haalbaar...">${esc(v.note)}</textarea></div>${v.blocks&&v.blocks.length?`<div class="resultSummary"><b>Uitvoering: ${calc.pct}%</b><br>${calc.label} · doeltempo: ${v.paceHit?'ja':'nee'}</div>`:''}<button class="primary" onclick="saveTrainingResult(${w},${d})">Trainingsresultaat opslaan</button></div></div>`}
function editTrainingResult(w,d){let v=get(resultKey(w,d),{});v.saved=false;set(resultKey(w,d),v);renderTraining()}
function setResultStatus(w,d,status){let v=get(resultKey(w,d),{});v.status=status;if(v.plannedMinutes==null)v.plannedMinutes=PLANNED_WORK[w-1];set(resultKey(w,d),v);if(status==='complete')set(`act-${w}-${d}-0`,true);else set(`act-${w}-${d}-0`,false);renderTraining()}
function saveTrainingResult(w,d){let v=get(resultKey(w,d),{});v.plannedMinutes=+document.querySelector('#plannedMinutes').value||0;v.blocks=document.querySelector('#actualBlocks').value.split(',').map(x=>x.trim()).filter(Boolean);v.paceHit=document.querySelector('#paceHit').checked;v.reasons=[...document.querySelectorAll('input[name="resultReason"]:checked')].map(x=>x.value);v.note=document.querySelector('#resultNote').value.trim();if(!v.status)v.status='partial';v.saved=true;set(resultKey(w,d),v);set(`act-${w}-${d}-0`,v.status==='complete');renderTraining()}
function saveWeeklyExtra(w){let name=document.querySelector('#weekly-extra-name').value.trim();if(!name)return;let k=`weekly-extra-${w}`,a=get(k,[]);a.push({name,note:document.querySelector('#weekly-extra-note').value.trim()});set(k,a);renderTraining()}
function strengthNote(x,w,d,i){return `<div class="log"><div class="logtop"><div><b>🏋️ ${esc(x.exercise)}</b><div class="details">${x.sets.length} sets · ${esc(x.note)}</div></div><button class="danger" onclick="removeItem('str-${w}-${d}',${i});renderTraining()">×</button></div><ol class="sets">${x.sets.map((s,j)=>`<li>Set ${j+1}: ${s.reps} herhalingen × ${s.weight} kg</li>`).join('')}</ol></div>`}
function strengthForm(w,d){return `<button class="linkbtn" onclick="toggle('strform-${d}')">＋ Krachtoefening toevoegen</button><div class="form" id="strform-${d}"><div class="grid2"><input id="ex-${d}" placeholder="Oefening, bijv. Squat"><select id="sc-${d}" onchange="drawSets(${d})">${[1,2,3,4,5,6].map(n=>`<option ${n===3?'selected':''}>${n}</option>`).join('')}</select></div><div class="hint">Aantal sets</div><div id="sets-${d}"></div><textarea id="sn-${d}" placeholder="Notitie, bijv. techniek voelde goed"></textarea><button class="primary" onclick="saveStrength(${w},${d})">Oefening opslaan</button></div>`}
function drawSets(d){let n=+document.querySelector(`#sc-${d}`).value,el=document.querySelector(`#sets-${d}`);el.innerHTML=Array.from({length:n},(_,i)=>`<div class="setrow"><span>Set ${i+1}</span><input type="number" min="0" id="rep-${d}-${i}" placeholder="Herhalingen"><input type="number" min="0" step="0.5" id="kg-${d}-${i}" placeholder="Gewicht kg"></div>`).join('')}
function saveStrength(w,d){let ex=document.querySelector(`#ex-${d}`).value.trim(),n=+document.querySelector(`#sc-${d}`).value;if(!ex)return alert('Vul een oefening in.');let sets=Array.from({length:n},(_,i)=>({reps:+document.querySelector(`#rep-${d}-${i}`).value||0,weight:+document.querySelector(`#kg-${d}-${i}`).value||0}));let k=`str-${w}-${d}`,a=get(k,[]);a.push({exercise:ex,sets,note:document.querySelector(`#sn-${d}`).value.trim()});set(k,a);renderTraining()}
function saveAlt(w,d){let name=document.querySelector(`#an-${d}`).value.trim();if(!name)return;let k=`alt-${w}-${d}`,a=get(k,[]);a.push({name,note:document.querySelector(`#at-${d}`).value.trim()});set(k,a);renderTraining()}function removeItem(k,i){let a=get(k,[]);a.splice(i,1);set(k,a)}function toggle(id){let e=document.querySelector('#'+id);e.classList.toggle('open');if(id.startsWith('strform')&&e.classList.contains('open'))drawSets(+id.split('-')[1])}
function renderFood(){let w=+foodWeek.value,d=+foodDay.value,k=`food-${w}-${d}`,v=get(k,{alcohol:0,note:''});foodPanel.innerHTML=`<article class="card"><div class="dayhead"><h3>🥗 ${D[d]}</h3><span class="pill">week ${w}</span></div>${FOOD[d].map(m=>`<div class="meal"><div class="hint">${m[0]}</div><b>${m[1]}</b><div class="ingredients">${m[2].map(x=>`<span class="ingredient">${x}</span>`).join('')}</div></div>`).join('')}</article><article class="card"><h3>Dagregistratie</h3><div class="field"><label>Alcoholische drankjes</label><div class="alcohol"><button onclick="alcohol(-1)">−</button><b id="alc">${v.alcohol}</b><button onclick="alcohol(1)">＋</button></div></div><div class="field"><label>Notitie over extra gegeten of juist niet gegeten</label><textarea id="foodNote" placeholder="Bijv. extra dessert, lunch overgeslagen…">${esc(v.note)}</textarea></div><button class="primary" onclick="saveFood()">Dag opslaan</button><div id="foodSaved" class="saved"></div></article>`}
function alcohol(n){alc.textContent=Math.max(0,+alc.textContent+n)}function saveFood(){let k=`food-${foodWeek.value}-${foodDay.value}`;set(k,{alcohol:+alc.textContent,note:foodNote.value.trim()});foodSaved.textContent='✓ Opgeslagen'}
function weightMoment(w,d){let v=get(`weight-${w}-${d}`,'');return `<section class="weightMoment"><div><b>⚖ Wekelijks weegmoment</b><span>${D[d]} · week ${w}</span></div><div class="weightEntry"><input id="weightInput-${w}-${d}" type="number" inputmode="decimal" min="30" max="250" step="0.1" value="${esc(v)}" placeholder="Bijv. 78,4"><span>kg</span><button onclick="saveWeight(${w},${d})">Opslaan</button></div><div id="weightSaved-${w}-${d}" class="saved"></div></section>`}
function saveWeight(w,d){let e=document.getElementById(`weightInput-${w}-${d}`),v=e.value;if(v)set(`weight-${w}-${d}`,v);else localStorage.removeItem(`weight-${w}-${d}`);document.getElementById(`weightSaved-${w}-${d}`).textContent=v?'✓ Gewicht opgeslagen':'Gewicht verwijderd'}
function weekAverage(w){let a=parseFloat(get(`weight-${w}-2`,'')),b=parseFloat(get(`weight-${w}-5`,''));return Number.isFinite(a)&&Number.isFinite(b)?Math.round((a+b)/2*10)/10:null}
function completedDays(w){let n=0;for(let d=0;d<7;d++)if(get(`act-${w}-${d}-0`,false))n++;return n}
function weightChart(v){let good=v.map((x,i)=>x==null?null:{i,v:x}).filter(Boolean);if(!good.length)return `<div class="emptyChart"><b>Nog geen weekgemiddelden</b><span>Vul woensdag én zaterdag in.</span></div>`;let lo=Math.min(...good.map(x=>x.v)),hi=Math.max(...good.map(x=>x.v));if(lo===hi){lo--;hi++}else{let p=Math.max(.5,(hi-lo)*.2);lo-=p;hi+=p}let W=760,H=260,L=55,R=25,T=28,B=42,X=i=>L+i*(W-L-R)/7,Y=x=>T+(hi-x)*(H-T-B)/(hi-lo);let grid=[0,.25,.5,.75,1].map(f=>{let y=T+f*(H-T-B),n=(hi-f*(hi-lo)).toFixed(1);return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${n}</text>`}).join(''),segments=[],cur=[];v.forEach((x,i)=>{if(x!=null)cur.push(`${X(i)},${Y(x)}`);else if(cur.length){segments.push(cur);cur=[]}});if(cur.length)segments.push(cur);return `<div class="chartWrap"><svg viewBox="0 0 ${W} ${H}"><g class="grid">${grid}</g><g class="weightLine">${segments.map(a=>`<polyline points="${a.join(' ')}"/>`).join('')}</g><g class="weightDots">${v.map((x,i)=>x==null?'':`<circle cx="${X(i)}" cy="${Y(x)}" r="6"/><text x="${X(i)}" y="${Y(x)-12}" text-anchor="middle">${String(x).replace('.',',')} kg</text>`).join('')}</g><g class="axisLabels">${v.map((_,i)=>`<text x="${X(i)}" y="${H-14}" text-anchor="middle">W${i+1}</text>`).join('')}</g></svg></div>`}
function renderProgress(){let a=Array.from({length:8},(_,i)=>weekAverage(i+1)),c=Array.from({length:8},(_,i)=>completedDays(i+1)),total=c.reduce((x,y)=>x+y,0);progressPanel.innerHTML=`<div class="progressHero"><div><span class="eyebrow">8-WEEK OVERVIEW</span><h2>Jouw voortgang</h2><p>Alle weken in één overzicht.</p></div><div class="totalScore"><strong>${total}/56</strong><span>dagen voltooid</span></div></div><article class="card"><h3>Succesvolle dagen per week</h3><div class="weekScores">${c.map((n,i)=>`<div class="weekScore"><div><b>Week ${i+1}</b><strong>${n}/7</strong></div><span><i style="width:${n/7*100}%"></i></span></div>`).join('')}</div></article><article class="card weightProgress"><h3>Gemiddeld gewicht per week</h3><p class="details">Gemiddelde van woensdag en zaterdag</p>${weightChart(a)}<div class="weightWeeks">${a.map((v,i)=>{let w=get(`weight-${i+1}-2`,''),z=get(`weight-${i+1}-5`,'');return `<div><b>Week ${i+1}</b><strong>${v==null?'–':String(v).replace('.',',')+' kg'}</strong><span>wo ${w||'–'} · za ${z||'–'}</span></div>`}).join('')}</div></article>`}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.tab).classList.add('active');if(b.dataset.tab==='progress')renderProgress()});document.querySelector('.weekSelect').onchange=e=>{set('uiWeek',+e.target.value);renderTraining()};foodWeek.onchange=foodDay.onchange=renderFood;renderTraining();renderFood();renderProgress();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=12'));
</script></body></html>
